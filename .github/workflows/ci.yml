name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: constants, audit, index
        run: |
          python3 tools/constants/check.py ${{ startsWith(github.ref, 'refs/tags/') && '--strict' || '' }}
          python3 tools/constants/index.py --check
      - name: banned words in durable prose
        run: python3 tools/constants/words.py README.md REPRODUCE.md docs/
      - name: docs budget (under 1,000 lines)
        run: |
          n=$(find docs -name '*.md' -print0 | xargs -0 cat | wc -l)
          echo "docs/: $n lines"; test "$n" -lt 1000

  diff-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: decisions are immutable (added, never modified or deleted)
        run: |
          changed=$(git diff --name-status --diff-filter=MDR origin/${{ github.base_ref }}...HEAD -- docs/decisions/)
          if [ -n "$changed" ]; then echo "$changed"; echo "docs/decisions/ files are never edited after merge"; exit 1; fi
      - name: no addresses, sockets or tokens in the diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- . ':!.github/workflows/ci.yml' | grep -E '^\+' | grep -nE \
            '([0-9]{1,3}\.){3}[0-9]{1,3}|[a-z_][a-z0-9_-]*@[a-z0-9.-]+\.[a-z]{2,}|ControlPath|ssh -p|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            && { echo "the diff names an address, a socket or a token"; exit 1; } || echo "diff clean"
